<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaisFrete - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #253663 0%, #1a2847 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #f4f6f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        h1 {
            font-size: 24px;
            color: #253663;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        p {
            font-size: 16px;
            color: #6c737f;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .retry-button {
            background: #253663;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .retry-button:hover {
            background: #1a2847;
            transform: translateY(-1px);
        }
        
        .retry-button:active {
            transform: translateY(0);
        }
        
        .features {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #e9ecef;
            text-align: left;
        }
        
        .features h2 {
            font-size: 14px;
            color: #253663;
            margin-bottom: 16px;
            font-weight: 600;
            text-align: center;
        }
        
        .feature-list {
            list-style: none;
        }
        
        .feature-item {
            font-size: 14px;
            color: #6c737f;
            padding: 8px 0;
            display: flex;
            align-items: center;
        }
        
        .feature-item::before {
            content: "✓";
            color: #28a745;
            font-weight: bold;
            margin-right: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>Você está offline</h1>
        <p>
            Não foi possível conectar à internet. Verifique sua conexão e tente novamente.
        </p>
        
        <button class="retry-button" onclick="window.location.reload()">
            Tentar Novamente
        </button>
        
        <div class="features">
            <h2>Funcionalidades Offline:</h2>
            <ul class="feature-list">
                <li class="feature-item">Visualizar fretes salvos</li>
                <li class="feature-item">Acessar perfil e configurações</li>
                <li class="feature-item">Ver histórico de transações</li>
                <li class="feature-item">Consultar dados em cache</li>
            </ul>
        </div>
    </div>
</body>
</html>

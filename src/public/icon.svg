<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#253663"/>
  
  <!-- MaisFrete Icon - Truck symbol -->
  <g transform="translate(128, 150)">
    <!-- Truck body -->
    <rect x="20" y="80" width="140" height="80" rx="8" fill="white"/>
    <rect x="160" y="100" width="60" height="60" rx="8" fill="white"/>
    
    <!-- Truck cabin -->
    <path d="M 180 100 L 180 80 L 200 60 L 220 80 L 220 100 Z" fill="white"/>
    
    <!-- Wheels -->
    <circle cx="60" cy="180" r="20" fill="#253663" stroke="white" stroke-width="4"/>
    <circle cx="120" cy="180" r="20" fill="#253663" stroke="white" stroke-width="4"/>
    <circle cx="190" cy="180" r="20" fill="#253663" stroke="white" stroke-width="4"/>
    
    <!-- Window -->
    <rect x="185" y="70" width="30" height="20" rx="4" fill="#253663"/>
    
    <!-- Cargo lines -->
    <line x1="40" y1="100" x2="140" y2="100" stroke="#253663" stroke-width="3"/>
    <line x1="40" y1="120" x2="140" y2="120" stroke="#253663" stroke-width="3"/>
    <line x1="40" y1="140" x2="140" y2="140" stroke="#253663" stroke-width="3"/>
  </g>
  
  <!-- Plus symbol for "Mais" -->
  <g transform="translate(340, 120)">
    <circle cx="20" cy="20" r="28" fill="#e9742b"/>
    <line x1="20" y1="8" x2="20" y2="32" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="white" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
